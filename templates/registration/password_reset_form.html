{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4">
  <h1 class="h4 fw-bold mb-1">Reset your password</h1>
  <p class="text-muted mb-4">Enter your email address and we will send you a reset link.</p>
  <form method="post">{% csrf_token %}
    <div class="input-group mb-2"><span class="input-group-text"><i class="bi bi-envelope"></i></span>
      <input class="form-control" type="email" name="email" required autofocus placeholder="you@company.com"></div>
    {% for e in form.email.errors %}<div class="text-danger small mb-2">{{ e }}</div>{% endfor %}
    <button class="btn btn-primary w-100 py-2 mt-2">Send reset link</button>
  </form>
  <div class="mt-3 small text-center"><a href="{% url 'login' %}">Back to sign in</a></div>
</div></div>
{% endblock %}
