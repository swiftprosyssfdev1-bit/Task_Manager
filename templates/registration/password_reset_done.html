{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4 text-center">
  <div class="fs-1 text-primary"><i class="bi bi-envelope-check"></i></div>
  <h1 class="h5 fw-bold">Check your email</h1>
  <p class="text-muted">If an account exists for that email, a reset link has been sent.</p>
  <a class="btn btn-primary" href="{% url 'login' %}">Back to sign in</a>
</div></div>
{% endblock %}
