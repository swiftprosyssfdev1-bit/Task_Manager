{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4">
  <h1 class="h4 fw-bold mb-1">Welcome back</h1>
  <p class="text-muted mb-4">Sign in to Task Manager to continue.</p>
  <form method="post">{% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>Incorrect username or password.</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span>
        <input class="form-control" name="username" id="id_username" autofocus required autocomplete="username"></div></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password"></div></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100 py-2">Sign in</button>
  </form>
  <div class="mt-3 small text-center"><a href="{% url 'password_reset' %}">Forgot your password?</a></div>
</div></div>
{% endblock %}
